title: Search for GitHub Actions Runner Secret Markers
id: 0f19fc6f-1cfc-4b62-8287-9d87531e8223
status: experimental
description: |
    Detects a text search for the isSecret marker or the memdump.py script name on a Linux host.
    The payload of the tj-actions/changed-files compromise (2025) downloaded memdump.py, ran it with sudo to read
    the memory of the Runner.Worker process through /proc/<pid>/maps and /proc/<pid>/mem, and extracted secrets
    from the dump with grep by the JSON key isSecret before printing them, base64-encoded twice, to the workflow log.
    Such a search has no place in ordinary build jobs.
references:
    - https://www.stepsecurity.io/blog/harden-runner-detection-tj-actions-changed-files-action-is-compromised
    - https://github.com/advisories/GHSA-mrrh-fwg8-r2c3
author: Alexander Kuzmin
date: 2026-11-09
tags:
    - attack.credential-access
    - attack.t1003.007
logsource:
    product: linux
    category: process_creation
detection:
    selection_search_img:
        Image|endswith:
            - '/grep'
            - '/egrep'
            - '/fgrep'
            - '/rg'
    selection_search_marker:
        CommandLine|contains: 'isSecret'
    selection_memdump:
        CommandLine|contains: 'memdump.py'
    condition: all of selection_search_* or selection_memdump
falsepositives:
    - Developers searching source code for an identifier named isSecret.
    - Authorized security testing of CI runners.
level: high
