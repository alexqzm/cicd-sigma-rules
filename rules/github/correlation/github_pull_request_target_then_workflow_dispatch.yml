title: GitHub Actions pull_request_target Run Followed by workflow_dispatch Run
id: 65c8f9cd-e58e-4c12-83fd-c45a48790b80
status: experimental
description: |
    Detects a workflow run triggered by pull_request_target followed within one hour by a manually dispatched
    workflow run in the same repository. A pull_request_target job receives the base repository's GITHUB_TOKEN,
    and workflow_dispatch events triggered with GITHUB_TOKEN still create workflow runs, so code that gains control
    of such a job can start other workflows of the repository, including publishing ones. In the Nx incident
    (s1ngularity, 2025) a pull_request_target workflow that echoed the pull request title without sanitization,
    write permissions of workflows and a publishing workflow that allowed manual dispatch together led to the theft
    of the npm publishing token. The one-hour window is a parameter of the rule, not a property of the incident.
references:
    - https://nx.dev/blog/s1ngularity-postmortem
    - https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target
    - https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
author: Alexander Kuzmin
date: 2026-11-09
tags:
    - attack.execution
    - attack.t1677
correlation:
    type: temporal_ordered
    rules:
        - github_workflow_run_pull_request_target
        - github_workflow_run_workflow_dispatch
    group-by:
        - repo
    timespan: 1h
falsepositives:
    - Maintainers dispatching workflows manually shortly after automated pull_request_target runs such as labeling or triage.
level: low
