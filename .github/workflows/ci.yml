name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ATTACK_URL: https://raw.githubusercontent.com/mitre-attack/attack-stix-data/a8db2f52eb933c9c99060c123e088b3326d3a607/enterprise-attack/enterprise-attack-20.1.json
  ATTACK_SHA256: 539a843a7b53ed9749740b2123dddae3726b1a4831841c32aca740b011b910b5
  ATLAS_COMMIT: cfb403b99c4cbc5ba7ff800f298c06ede3c41952

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Установка (версии и хеши закреплены)
        run: python -m pip install --require-hashes -r requirements.txt
      - name: MITRE ATT&CK 20.1 (SHA-256 закреплён)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/attack.json" "$ATTACK_URL"
          echo "$ATTACK_SHA256  $RUNNER_TEMP/attack.json" | sha256sum -c -
      - name: Атлас инцидентов (закреплённый коммит)
        run: |
          git clone -q https://github.com/alexqzm/cps-supply-chain-atlas "$RUNNER_TEMP/atlas"
          git -C "$RUNNER_TEMP/atlas" checkout -q "$ATLAS_COMMIT"
      - name: Статический анализ
        run: python -m pyflakes tools tests
      - name: Валидаторы pySigma
        run: python -m tools.check --attack "$RUNNER_TEMP/attack.json"
      - name: Тесты (эталонные события, каталог событий GitHub, семантика корреляций)
        run: python -m pytest -q
      - name: Запросы совпадают с правилами
        run: python -m tools.convert --check
      - name: Таблица правил совпадает с правилами
        run: python -m tools.table --attack "$RUNNER_TEMP/attack.json" --atlas "$RUNNER_TEMP/atlas" --check

  siem:
    runs-on: ubuntu-24.04
    services:
      opensearch:
        image: opensearchproject/opensearch:3.8.0@sha256:fafe3fc3587088674669235575aa166228c48bdb940294a8cdbbc1da75236a40
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          cluster.routing.allocation.disk.threshold_enabled: "false"
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          cluster.routing.allocation.disk.threshold_enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Установка (версии и хеши закреплены)
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Запросы в OpenSearch 3.8.0
        run: |
          echo "## Запросы из conversions/ в движках SIEM" >> "$GITHUB_STEP_SUMMARY"
          for strings in keyword lowercase; do
            python -m tools.siem_it --engine opensearch --url http://localhost:9200 \
              --strings "$strings" --report "$GITHUB_STEP_SUMMARY"
          done
      - name: Запросы в Elasticsearch 9.5.5
        run: |
          for strings in keyword lowercase; do
            python -m tools.siem_it --engine elasticsearch --url http://localhost:9201 \
              --strings "$strings" --report "$GITHUB_STEP_SUMMARY"
          done
      - name: Семантика корреляции temporal в Elasticsearch (ES|QL и EQL)
        run: python -m tools.correlation_probe --url http://localhost:9201

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12 (SHA-256 закреплён)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
