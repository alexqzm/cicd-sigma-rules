title: GitHub Actions GITHUB_TOKEN Permission Policy Changed
id: 0fa324e5-e756-40c3-81d0-ad5dd92dd1c8
status: experimental
description: |
    Detects a change of the default permissions granted to GITHUB_TOKEN or of the policy that allows
    GitHub Actions to create and approve pull requests, for an organization or a repository.
    GitHub recommends read-only default permissions for GITHUB_TOKEN and warns that letting workflows create or
    approve pull requests is a risk if such pull requests are merged without proper oversight. Write permissions
    of workflows were one of the conditions of the Nx (s1ngularity, 2025) compromise.
    The rule reports every change, because the values of the policy fields are not documented.
references:
    - https://docs.github.com/en/actions/reference/security/secure-use
    - https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization
    - https://nx.dev/blog/s1ngularity-postmortem
author: Alexander Kuzmin
date: 2026-11-09
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    product: github
    service: audit
    definition: 'Requirements: GitHub organization or enterprise audit log events (audit log streaming, REST API or JSON export) with the documented field names'
detection:
    selection:
        action:
            - 'org.set_default_workflow_permissions'
            - 'repo.set_default_workflow_permissions'
            - 'org.set_workflow_permission_can_approve_pr'
            - 'repo.set_workflow_permission_can_approve_pr'
    condition: selection
falsepositives:
    - Approved administrative changes, including tightening of the policy.
level: low
